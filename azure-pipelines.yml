trigger:
- master
stages:
  -  stage: 'Buildapplicationj'
     displayName: 'buildapplication'
     jobs:
       - job: 
         displayName: 'Jobs'
         pool:
          name: 'Secagent'
         steps:
              - task: CopyFiles@1
                inputs:
                  SourceFolder: 'jashuababu/Portfolio-Home-page/script.js'
                  Contents: '**'
                  TargetFolder: '$(Build.artifactstagingdirectory)'
              - task: PublishBuildArtifacts@1
                inputs:
                  PathtoPublish: '$(Build.ArtifactStagingDirectory)'
                  ArtifactName: 'drop'
                  publishLocation: 'Container'

